# Mixed team, rotation 2 of 3 — Q3 in tmp/Decisions.md. See mixed_1.yaml for
# the full rationale; this is the same 3-pair structure, rotated one family on.
#
# This rotation: PO+Backend = Azure/GPT, Frontend+QA = Google, SM+Architect = Anthropic.

name: mixed_2

roster:
  - product_owner
  - backend_dev
  - frontend_dev
  - qa_engineer
  - scrum_master
  - architect

panel:
  product_owner: {model: gpt-5.6-terra, provider: azure_ai}
  backend_dev: {model: gpt-5.6-terra, provider: azure_ai}
  frontend_dev: {model: gemini-3.6-flash, provider: google}
  qa_engineer: {model: gemini-3.6-flash, provider: google}
  scrum_master: {model: claude-sonnet-5, provider: anthropic}
  architect: {model: claude-sonnet-5, provider: anthropic}

strategy:
  name: bidding
  params:
    bid_prompt: prompts/bid_prompt.txt
    starting_agent: scrum_master

task_prompt: prompts/prompt_complex.txt
system_prompt: prompts/system_prompt.txt
summarize_prompt: prompts/summarize_prompt.txt

role_knowledge: true
turn_budget: 24

temperature: null
seed: 0

summarizer:
  model: deepseek-v4-flash
  provider: deepseek
  temperature: 0.0

output_dir: runs
