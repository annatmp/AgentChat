# Homogeneous team, Google panel — Q1/Q2 in tmp/Decisions.md. All six roles on
# the same model family. Compare against homogeneous_anthropic and
# homogeneous_azure_gpt for the strategy-vs-family question.

name: homogeneous_google

roster:
  - product_owner
  - backend_dev
  - frontend_dev
  - qa_engineer
  - scrum_master
  - architect

panel:
  product_owner: {model: gemini-3.6-flash, provider: google}
  backend_dev: {model: gemini-3.6-flash, provider: google}
  frontend_dev: {model: gemini-3.6-flash, provider: google}
  qa_engineer: {model: gemini-3.6-flash, provider: google}
  scrum_master: {model: gemini-3.6-flash, provider: google}
  architect: {model: gemini-3.6-flash, provider: google}

strategy:
  name: bidding
  params:
    bid_prompt: prompts/bid_prompt.txt
    starting_agent: scrum_master

task_prompt: prompts/prompt_complex.txt
system_prompt: prompts/system_prompt.txt
summarize_prompt: prompts/summarize_prompt.txt

role_knowledge: true
turn_budget: 24

temperature: null
seed: 0

summarizer:
  model: deepseek-v4-flash
  provider: deepseek
  temperature: 0.0

output_dir: runs
