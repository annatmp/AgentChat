# Homogeneous team, Anthropic panel — Q1/Q2 in tmp/Decisions.md. All six roles
# on the same model family. Compare against configs/solo_anthropic.yaml for the
# team-vs-solo question, and against homogeneous_azure_gpt/homogeneous_google
# for the strategy-vs-family question.

name: homogeneous_anthropic

roster:
  - product_owner
  - backend_dev
  - frontend_dev
  - qa_engineer
  - scrum_master
  - architect

panel:
  product_owner: {model: claude-sonnet-5, provider: anthropic}
  backend_dev: {model: claude-sonnet-5, provider: anthropic}
  frontend_dev: {model: claude-sonnet-5, provider: anthropic}
  qa_engineer: {model: claude-sonnet-5, provider: anthropic}
  scrum_master: {model: claude-sonnet-5, provider: anthropic}
  architect: {model: claude-sonnet-5, provider: anthropic}

strategy:
  name: bidding
  params:
    bid_prompt: prompts/bid_prompt.txt
    starting_agent: product_owner

task_prompt: prompts/prompt_complex.txt
system_prompt: prompts/system_prompt.txt
summarize_prompt: prompts/summarize_prompt.txt

role_knowledge: true
turn_budget: 24

temperature: null
seed: 0

summarizer:
  model: deepseek-v4-flash
  provider: deepseek
  temperature: 0.0

output_dir: runs
